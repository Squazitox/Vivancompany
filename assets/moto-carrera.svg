<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 900 330" role="img" aria-label="Moto de carrera deportiva" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3b49"/><stop offset=".55" stop-color="#d51a29"/><stop offset="1" stop-color="#8e101c"/></linearGradient>
  <linearGradient id="redb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a5121f"/><stop offset="1" stop-color="#e6212f"/></linearGradient>
  <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f4a"/><stop offset="1" stop-color="#0d0e11"/></linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f4f7"/><stop offset=".5" stop-color="#9aa1ac"/><stop offset="1" stop-color="#555b66"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe9ff" stop-opacity=".75"/><stop offset="1" stop-color="#7fb4e6" stop-opacity=".25"/></linearGradient>
  <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <g id="wheel">
    <circle r="73" fill="none" stroke="#0b0b0d" stroke-width="20"/>
    <circle r="82" fill="none" stroke="#25272c" stroke-width="1.5"/>
    <circle r="56" fill="#15171b" stroke="url(#chrome)" stroke-width="6"/>
    <g stroke="#c9ced6" stroke-width="7" stroke-linecap="round"><path d="M0 0V-50M0 0L47.5-15.5M0 0L29.4 40.5M0 0L-29.4 40.5M0 0L-47.5-15.5"/></g>
    <circle r="33" fill="none" stroke="#e8ebef" stroke-width="3"/>
    <circle r="26" fill="none" stroke="#9aa1ac" stroke-width="1.5" stroke-dasharray="3 4"/>
    <circle r="11" fill="#2a2d33" stroke="#e8ebef" stroke-width="3"/>
  </g>
</defs>

